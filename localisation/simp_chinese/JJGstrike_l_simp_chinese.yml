JJGstrike.1.t:0"大吼一声扑向老蒋"
JJGstrike.1.d:0"这天经国得到了准确的消息，他的老爹竟然暗示雨农对着仅存的几个中立的官员系统，尤其是自己领导的那一批组织§O赣南新政§O的同志发动了惨无人道的进攻，同时大量的报刊被封禁，可以预料，他的老爹将会在某条不归路上越走越远。\n于是，在一腔热血与愤怒当中，他召集了剩余的力量，争取到了杜聿明的全力支持，黄维送上了行动方案，并且摇来了两个营的士兵，他们都是新政实施后家里分了田的。\n夜幕笼罩在这片古老的土地上，经国决定对他的父亲做最后的挽救。他邀请父亲到湖边一谈。\n显然，蒋介石并没有任何退让的意思，经国将手不自觉的摸向腰间……"
JJGstrike.1.a:0 "不！你这个叛徒！——两人同时说"
JJGstrike.1.b:0 "怒火翻腾着，但他转过了头。"
JJGstrike.2.t:0"已击毙"
JJGstrike.2.d:0"中华民国总参谋部第403号命令：\n即日起解散蓝衣社，戴笠调任国防部保密局局长；\n解除宋美龄航空委员会秘书长职务，并对航空战机采购方案重新审验；\n解除何应钦中国陆军总司令职务，改任昆明同盟国战区协调部部长、驻印军官团总司令；\n解除汤恩伯鲁苏豫皖四省边区总部总司令职务，改任中国陆军第二战区参谋总长；\n孔令侃涉嫌走私大量鸦片已逮捕。解除孔祥熙财政部长职务并监视居住；\n……\n（下一页）\n杜聿明改任陆军军事教育总监；\n黄维改任首都警卫部队司令；\n戴安澜改任装甲兵教育总监；\n廖耀湘改任第一机械化军军长；\n程潜改任陆军总司令；\n海军和空军至今日十二时除陈绍宽、周至柔命令外不做变动\n（下转第四版为平反人员名单；第五版为土地分配办法概述；第六版为贸易谈判最新进展。）"
JJGstrike.2.a:0 "打祸国的败类、救最苦的同胞"
