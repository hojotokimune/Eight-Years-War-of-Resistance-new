l_simp_chinese:
KMTzongdufocustreeex:0"切换到中华民国绥靖公署通用国策树"
KMTzhuanyuan1: "专员送行宴会的结束"
KMTzhuanyuan2: "开始工作"
KMTzhuanyuan3: "榨取当地资源"
KMTzhuanyuan4: "掠夺本地人"
KMTzhuanyuan5: "§B申请支援"
KMTzhuanyuan6: "§R大火燃烧……"
KMTzhuanyuan7: "§Y时钟滴答……"
KMTzhuanyuan8: "§R再不受制于人"
KMTzhuanyuan1_desc: "鲤鱼焙面，延津做法，阁下您吃着怎么样？"
KMTzhuanyuan2_desc: "凝聚意志保卫领袖……快动起来！动起来！你们这帮懒鬼！"
KMTzhuanyuan3_desc: "从地里挖出来一些好东西是很有必要的，一方面能够让我们拥有好看的财报，另一方面和宗主谈判的筹码也更多一点。"
KMTzhuanyuan4_desc: "把这些拿走！"
KMTzhuanyuan5_desc: "快打电话给海军，我们需要一场近距离炮击来震慑这群抵抗者！"
KMTzhuanyuan6_desc: "我军取得决定性胜利！当地负隅顽抗之敌被尽数消灭后，我军胜利转进！……养寇自重的把戏也太low了。"
KMTzhuanyuan7_desc: "我们将对手控制在一个能够自由调节的敌对区域当中，内部的反对者也可以打包塞过去，现在，做好准备……"
KMTzhuanyuan8_desc: "今天，是伟大的一天，也是我们亲爱的专员回家的日子，显然来自情报部门的各种污蔑和造谣严重伤害到了专员，于是他决定带领一支陆海空混编军团回到故土。"