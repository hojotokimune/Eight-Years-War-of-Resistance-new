l_simp_chinese:
ZongduKMTrework:0"§H重建生存空间§H"
ZongduKMTrework_desc:0"§H大家要知道现在革命已到了很危险的地位，我们从广东出来完成北伐的军队，可以说是本党的基本军队，这基本军队现在站在中国最繁华的长江一带尤其是沪宁路津浦路这一带的地方。我们看古来历史，以及民国十七年来的历史，凡到了东南的军队，绝对不能久站的，怎么好的军队都变坏了;最后的结果总是给人家消灭，尤其是南京这个地方，从六朝以来，是最腐败的地点，到了这地点的军队没有不腐败消灭的。现在我们的军队差不多和从前的军队一样了。从前的官长没有注意到这一点，只想江浙富庶之区，可以争权夺利，全不注意到他的部下腐败堕落，等到他注意到的时候，军队已不可救药了;他自己的号令也不能行了;最后的结果是上下同归于尽。但是从前军阀的军队，是各人干各人的，没有党，没有主义，对国家也没有责任，完全自私自利的。我们呢?党的生命，国家的存亡完全在我们肩上，我们要时时提防军队腐败和本军堕落，否则国家危亡，党的生命断绝，自己也消灭自己了。这样想起来，更要时刻惕励，不受恶环境的引诱。从前军队的腐败，可以嫖、赌、贪钱，我们现在负了挽救国家实行三民主义的责任，却万不可以偷懒一点，浪漫一点。如果我们稍有苟且偷安的思想，不仅自己要灭亡自己，国家也要由我们手里来灭亡，我们何以对一般死了的官长和同志呢?§H"
